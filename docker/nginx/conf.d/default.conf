# ==============================================================================
# CONFIGURACIÓN VIRTUAL HOST REVERSE PROXY NGINX (SPRING KAFKA DEMO)
# ==============================================================================

upstream backend_upstream {
    server host.docker.internal:8080;
    keepalive 32;
}

upstream frontend_upstream {
    server host.docker.internal:4200;
    keepalive 16;
}

upstream kafka_ui_upstream {
    server kafka-ui:8080;
}

server {
    listen 80;
    server_name localhost 127.0.0.1;

    # Tamaño máximo de carga para prevenir desbordamientos de memoria
    client_max_body_size 10M;

    # Límites de conexiones simultáneas por IP
    limit_conn conn_limit 30;

    # -------------------------------------------------------------------------
    # CABECERAS GLOBALES DE SEGURIDAD HTTP (Hardening OWASP)
    # -------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # -------------------------------------------------------------------------
    # 1. CANAL WEBSOCKET STOMP (Realtime bidirectional notifications)
    # -------------------------------------------------------------------------
    location /api/v1/ws-notifications {
        proxy_pass http://backend_upstream/api/v1/ws-notifications;

        # Upgrade de protocolo a WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts prolongados para sockets en tiempo real
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # -------------------------------------------------------------------------
    # 2. STREAM SERVER-SENT EVENTS (SSE) (Realtime server-to-client notifications)
    # -------------------------------------------------------------------------
    location /api/v1/notifications/stream {
        proxy_pass http://backend_upstream/api/v1/notifications/stream;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Crucial para SSE: Desactivar buffering y compresión intermedia
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        chunked_transfer_encoding off;

        proxy_read_timeout 3600s;
    }

    # -------------------------------------------------------------------------
    # 3. SEGURIDAD: CONTROL DE ACCESO A ENDPOINTS DE SPRING BOOT ACTUATOR
    # -------------------------------------------------------------------------
    # Permitir únicamente el health check para liveness / readiness probes
    location = /api/v1/actuator/health {
        proxy_pass http://backend_upstream/api/v1/actuator/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Bloquear acceso externo a métricas sensibles (Prometheus, Heap, Env, Mappings)
    location /api/v1/actuator {
        return 403 '{"status":403,"error":"Forbidden","message":"El acceso externo a endpoints de administración Actuator está restringido por directiva de seguridad."}\n';
        add_header Content-Type application/json;
    }

    # -------------------------------------------------------------------------
    # 4. API REST BACKEND (Ingesta de notificaciones, historial y estadísticas)
    # -------------------------------------------------------------------------
    location /api/ {
        # Aplicar Rate Limiting (Máx 20 req/s con ráfaga de 30)
        limit_req zone=api_rate_limit burst=30 nodelay;

        proxy_pass http://backend_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # -------------------------------------------------------------------------
    # 5. KAFKA UI (Consola de monitoreo de Kafka)
    # -------------------------------------------------------------------------
    location /kafka-ui/ {
        proxy_pass http://kafka_ui_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # -------------------------------------------------------------------------
    # 6. PORTAL FRONTEND ANGULAR (Dashboard y Log Viewer)
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Soporte para WebSockets de Angular HMR / Webpack dev server
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

