user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ocultar versión del servidor Nginx (Seguridad)
    server_tokens off;

    # Formato de logs con tiempos de respuesta de upstream
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Optimizaciones de E/S
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Compresión Gzip para mejorar rendimiento
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Zona de Rate Limiting para protección contra DoS / Inundación de endpoints API
    limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Mapeo de cabecera Connection para compatibilidad WebSocket STOMP
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Cargar configuraciones de virtual hosts
    include /etc/nginx/conf.d/*.conf;
}

